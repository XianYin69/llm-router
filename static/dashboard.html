<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>llm-router dashboard</title>
<style>
 body{font:14px/1.5 system-ui;margin:24px;max-width:980px;background:#0f1115;color:#e6e6e6}
 h1{font-size:20px} h2{font-size:15px;margin-top:24px;color:#8ab4f8}
 table{border-collapse:collapse;width:100%} td,th{padding:6px 8px;border-bottom:1px solid #2a2f3a;text-align:left}
 input{padding:6px;width:280px;background:#171a21;color:#e6e6e6;border:1px solid #2a2f3a}
 button{padding:6px 12px;background:#8ab4f8;border:0;border-radius:4px;cursor:pointer}
 .muted{color:#8b93a7} .err{color:#f28b82}
</style>
</head>
<body>
<h1>llm-router <span class="muted">v0.1</span></h1>
<input id="k" placeholder="master api key (optional)">
<button onclick="load()">Refresh</button>
<span id="msg" class="muted"></span>
<h2>Models</h2><table id="models"></table>
<h2>Usage</h2><table id="usage"></table>
<h2>Key pool</h2><table id="pool"></table>
<script>
const H = () => { const k = document.getElementById('k').value.trim();
  return k ? { Authorization: 'Bearer ' + k } : {}; };

const row = (a) => '<tr>' + a.map(x => '<td>' + x + '</td>').join('') + '</tr>';
async function get(u) { const r = await fetch(u, { headers: H() });
  if (!r.ok) throw new Error(u + ' -> ' + r.status); return r.json(); }
async function load() {
  const m = document.getElementById('msg'); m.textContent = 'loading...'; m.className = 'muted';
  try {
    const models = (await get('/v1/models')).data || [];
    document.getElementById('models').innerHTML =
      row(['Model', 'Owned by']) + models.map(x => row([x.id, x.owned_by])).join('');
    const st = await get('/stats'); const keys = st.keys || {};
    document.getElementById('usage').innerHTML =
      row(['Model', 'Requests', 'Errors', 'Avg ms', 'In', 'Out']) +
      Object.entries(keys).map(([k, v]) =>
        row([k, v.requests, '<span class="' + (v.errors ? 'err' : '') + '">' + v.errors + '</span>',
             v.avg_ms, v.prompt_tokens, v.completion_tokens])).join('') || row(['<i>no traffic</i>']);
    const pl = await get('/pool');
    document.getElementById('pool').innerHTML =
      row(['Provider', 'Keys', 'Cooling']) +
      Object.entries(pl).map(([k, v]) => row([k, v.total, v.cooling])).join('');
    m.textContent = 'ok · uptime ' + (st.uptime_s || 0) + 's';
  } catch (e) { m.textContent = e.message; m.className = 'err'; }
}
load();
</script>
</body>
</html>
